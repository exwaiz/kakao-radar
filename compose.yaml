services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${RADAR_DB_PASSWORD:?Set RADAR_DB_PASSWORD in .env}
    volumes:
      - radar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      retries: 10
  api:
    build: ./server
    environment:
      RADAR_DATABASE_URL: postgresql://radar:${RADAR_DB_PASSWORD}@db:5432/radar
      RADAR_PUBLIC_URL: ${RADAR_PUBLIC_URL:-}
      RADAR_DIGEST_LINK_SECRET: ${RADAR_DIGEST_LINK_SECRET:-}
      RADAR_NTFY_URL: ${RADAR_NTFY_URL:-}
      RADAR_NTFY_TOPIC: ${RADAR_NTFY_TOPIC:-}
      RADAR_NTFY_TOKEN: ${RADAR_NTFY_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  retention:
    build: ./server
    environment:
      RADAR_DATABASE_URL: postgresql://radar:${RADAR_DB_PASSWORD}@db:5432/radar
    command: ["python", "-m", "radar_server.retention"]
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: ./server
    profiles: ["analysis"]
    environment:
      RADAR_DATABASE_URL: postgresql://radar:${RADAR_DB_PASSWORD}@db:5432/radar
      RADAR_ANALYSIS_PROVIDER: ${RADAR_ANALYSIS_PROVIDER:-disabled}
    command: ["python", "-m", "radar_server.worker"]
    depends_on:
      db:
        condition: service_healthy
  delivery:
    build: ./server
    profiles: ["delivery"]
    environment:
      RADAR_DATABASE_URL: postgresql://radar:${RADAR_DB_PASSWORD}@db:5432/radar
      RADAR_DELIVERY_PROVIDER: ${RADAR_DELIVERY_PROVIDER:-disabled}
      RADAR_NTFY_URL: ${RADAR_NTFY_URL:-}
      RADAR_NTFY_TOPIC: ${RADAR_NTFY_TOPIC:-}
      RADAR_NTFY_TOKEN: ${RADAR_NTFY_TOKEN:-}
      RADAR_PUBLIC_URL: ${RADAR_PUBLIC_URL:-}
      RADAR_DIGEST_LINK_SECRET: ${RADAR_DIGEST_LINK_SECRET:-}
    command: ["python", "-m", "radar_server.delivery_worker"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  radar-db:
