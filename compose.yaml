services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${RADAR_DB_PASSWORD:?Set RADAR_DB_PASSWORD in .env}
    volumes:
      - radar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      retries: 10
  api:
    build: ./server
    environment:
      RADAR_DATABASE_URL: postgresql://radar:${RADAR_DB_PASSWORD}@db:5432/radar
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  retention:
    build: ./server
    environment:
      RADAR_DATABASE_URL: postgresql://radar:${RADAR_DB_PASSWORD}@db:5432/radar
    command: ["python", "-m", "radar_server.retention"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  radar-db:
